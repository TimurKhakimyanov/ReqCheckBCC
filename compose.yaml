# ReqCheck — полный стек. Запуск: cp .env.example .env && docker compose up -d --build
# Профили: monitoring, offline, gpu, test, cli — см. docs/architecture.md.
# Разделы помечены владельцем; правьте только свой раздел.
name: reqcheck

x-python-build: &python-build
  context: .
  args:
    AGENT_VERSION: ${AGENT_VERSION:-dev}

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY}
  S3_ENDPOINT_URL: http://seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-reqcheck}
  EMBEDDER_URL: http://embedder:8001
  APP_SECRET_KEY: ${APP_SECRET_KEY}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
  DEFAULT_LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
  DEFAULT_LLM_MODEL: ${LLM_MODEL:-}
  OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-http://ollama:11434/v1}

services:
  # ===================== Веб (сессия «Веб») =====================
  web:
    build: { context: ., dockerfile: services/web/Dockerfile, target: runtime }
    restart: unless-stopped
    depends_on: [api]
    ports: ["${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8080}:8080"]
    networks: [frontend]

  # ===================== Бэкенд (сессия «Бэкенд») =====================
  api:
    build: { <<: *python-build, dockerfile: services/api/Dockerfile, target: runtime }
    restart: unless-stopped
    environment:
      <<: *app-env
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
      seaweedfs: { condition: service_started }
    networks: [frontend, backend]

  migrate:
    build: { <<: *python-build, dockerfile: services/api/Dockerfile, target: runtime }
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  worker:
    build: { <<: *python-build, dockerfile: services/worker/Dockerfile, target: runtime }
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend]

  embedder:
    build:
      <<: *python-build
      dockerfile: services/embedder/Dockerfile
      target: runtime
      args:
        EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-intfloat/multilingual-e5-small}
    restart: unless-stopped
    environment:
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-local}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-intfloat/multilingual-e5-small}
    networks: [backend]

  # ===================== Ядро / CLI (сессия «Ядро») =====================
  cli:
    build: { <<: *python-build, dockerfile: services/cli/Dockerfile, target: runtime }
    profiles: [cli]
    env_file: [{ path: .env, required: false }]
    volumes: ["./data:/data"]
    networks: [backend]

  # ===================== Инфраструктура (сессия «Инфраструктура») =====================
  # Наружу (на ${BIND_ADDR}) публикуются только web и grafana; всё остальное — только в сети backend.
  # Лимиты ресурсов — значения по умолчанию для одного сервера; переопределяйте в compose.override.yaml.
  # Ротация логов: json-file, 5 файлов по 10 МБ на контейнер (якорь *infra-logging).
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?задайте POSTGRES_DB в .env}
      POSTGRES_USER: ${POSTGRES_USER:?задайте POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    # Postgres 18+: данные лежат в /var/lib/postgresql/<major>/docker — монтируем родительский каталог.
    volumes: ["postgres-data:/var/lib/postgresql"]
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }
    logging: &infra-logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks: [backend]

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?задайте REDIS_PASSWORD в .env}
    # Пароль берётся из окружения внутри контейнера, а не из командной строки (не светится в docker inspect/ps).
    # noeviction: Redis — брокер Celery, вытеснять задачи нельзя.
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1", memory: 768m }
    logging: *infra-logging
    networks: [backend]

  qdrant:
    image: qdrant/qdrant:v1.20.2
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?задайте QDRANT_API_KEY в .env}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    # В образе нет curl/wget — HTTP-запрос к /readyz через bash /dev/tcp (эндпоинт без авторизации).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }
    logging: *infra-logging
    networks: [backend]

  seaweedfs:
    image: chrislusf/seaweedfs:4.55
    restart: unless-stopped
    # entrypoint собирает s3.json из S3_ACCESS_KEY/S3_SECRET_KEY и создаёт бакет S3_BUCKET.
    entrypoint: ["/bin/sh", "/etc/seaweedfs/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?задайте S3_ACCESS_KEY в .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?задайте S3_SECRET_KEY в .env}
      S3_BUCKET: ${S3_BUCKET:-reqcheck}
      SEAWEEDFS_VOLUME_SIZE_MB: ${SEAWEEDFS_VOLUME_SIZE_MB:-1024}
    volumes:
      - seaweedfs-data:/data
      - ./deploy/seaweedfs/entrypoint.sh:/etc/seaweedfs/entrypoint.sh:ro
    # healthy = master и S3 отвечают и бакет уже создан.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/seaweedfs/bucket-ready && wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }
    logging: *infra-logging
    networks: [backend]

  # --- Локальная LLM: профиль offline (CPU) ИЛИ gpu (NVIDIA). Включайте только один из двух. ---
  # Модели из OLLAMA_MODELS скачиваются при сборке образа и лежат в нём (/models), том не нужен:
  # после `docker compose up -d --build` сервер работает без интернета.
  ollama:
    build:
      context: deploy/ollama
      args:
        OLLAMA_PULL_MODELS: ${OLLAMA_MODELS:-}
    image: reqcheck-ollama:local
    profiles: [offline]
    restart: unless-stopped
    environment: &ollama-env
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
    healthcheck: &ollama-healthcheck
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits: { memory: "${OLLAMA_MEM_LIMIT:-16g}" }
    logging: *infra-logging
    networks: [backend]

  ollama-gpu:
    build:
      context: deploy/ollama
      args:
        OLLAMA_PULL_MODELS: ${OLLAMA_MODELS:-}
    image: reqcheck-ollama:local
    profiles: [gpu]
    restart: unless-stopped
    environment: *ollama-env
    healthcheck: *ollama-healthcheck
    deploy:
      resources:
        limits: { memory: "${OLLAMA_MEM_LIMIT:-16g}" }
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    logging: *infra-logging
    # Тот же DNS-адрес, что у CPU-варианта: OPENAI_COMPATIBLE_BASE_URL=http://ollama:11434/v1 работает в обоих профилях.
    networks:
      backend:
        aliases: [ollama]

  # --- Мониторинг (профиль monitoring) ---
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY}
    # prometheus.yml не подставляет переменные: ключ Qdrant кладём в файл и читаем через credentials_file.
    entrypoint:
      - /bin/sh
      - -c
      - |
        umask 077 && printf '%s' "$$QDRANT_API_KEY" > /tmp/qdrant_api_key && exec /bin/prometheus "$$@"
      - prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }
    logging: *infra-logging
    networks: [backend]

  grafana:
    image: grafana/grafana:13.2.7
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?задайте GRAFANA_ADMIN_PASSWORD в .env}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SERVE_FROM_SUB_PATH:-false}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Работа без интернета: не ходить за обновлениями, новостями и плагинами.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/reqcheck.json
    ports: ["${BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"]
    volumes:
      - ./deploy/monitoring/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_started }
      loki: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }
    logging: *infra-logging
    networks: [backend]

  loki:
    image: grafana/loki:3.7.10
    profiles: [monitoring]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-336h}
    volumes:
      - ./deploy/monitoring/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    # Образ distroless (нет shell/wget) — healthcheck невозможен; доступность видна в Prometheus: up{job="loki"}.
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }
    logging: *infra-logging
    networks: [backend]

  alloy:
    image: grafana/alloy:v1.22.0
    profiles: [monitoring]
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      # Собираем логи только контейнеров этого compose-проекта.
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-reqcheck}
    volumes:
      - ./deploy/monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki: { condition: service_started }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
    logging: *infra-logging
    networks: [backend]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.21.1
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128m }
    logging: *infra-logging
    networks: [backend]

  redis-exporter:
    image: oliver006/redis_exporter:v1.99.0-alpine
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Длина очереди Celery (список `celery` в db0) → метрика redis_key_size{key="celery"}.
      REDIS_EXPORTER_CHECK_SINGLE_KEYS: db0=celery
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9121/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128m }
    logging: *infra-logging
    networks: [backend]

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.1
    profiles: [monitoring]
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,process
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
    logging: *infra-logging
    networks: [backend]

  # --- Бэкапы (профиль backup): docker compose --profile backup run --rm backup ---
  backup:
    build: { context: deploy/tools }
    image: reqcheck-tools:local
    profiles: [backup]
    command: ["backup"]
    environment: &tools-env
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-reqcheck}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes: ["./backups:/backups"]
    depends_on: &tools-depends
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    logging: *infra-logging
    networks: [backend]

  # ===================== Тесты (профиль test; запуск только в Docker) =====================
  # docker compose --profile test run --rm --build test-<имя>
  test-contracts:
    build: { context: ., dockerfile: packages/contracts/Dockerfile, target: test }
    profiles: [test]
    network_mode: none

  test-core:
    build: { <<: *python-build, dockerfile: packages/core/Dockerfile, target: test }
    profiles: [test]
    network_mode: none

  test-api:
    build: { <<: *python-build, dockerfile: services/api/Dockerfile, target: test }
    profiles: [test]
    environment:
      <<: *app-env
      APP_ENV: test
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: test-password
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend]

  test-worker:
    build: { <<: *python-build, dockerfile: services/worker/Dockerfile, target: test }
    profiles: [test]
    environment:
      <<: *app-env
      APP_ENV: test
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend]

  test-embedder:
    build: { <<: *python-build, dockerfile: services/embedder/Dockerfile, target: test }
    profiles: [test]
    network_mode: none

  test-web:
    build: { context: ., dockerfile: services/web/Dockerfile, target: test }
    profiles: [test]
    network_mode: none

  # Смоук-тест инфраструктуры (сессия «Инфраструктура»): postgres, redis, qdrant, S3 (запись и чтение объекта).
  test-infra:
    build: { context: deploy/tools }
    image: reqcheck-tools:local
    profiles: [test]
    command: ["smoke"]
    environment: *tools-env
    depends_on: *tools-depends
    networks: [backend]

networks:
  frontend:
  backend:

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  qdrant-snapshots:
  seaweedfs-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
