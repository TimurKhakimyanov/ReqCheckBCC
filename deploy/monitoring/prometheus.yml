# Prometheus ReqCheck (профиль monitoring). Имена метрик приложения — docs/monitoring.md.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    stack: reqcheck

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # --- Приложение (метрики отдаёт сессия «Бэкенд») ---
  - job_name: api
    metrics_path: /metrics
    static_configs: [{ targets: ["api:8000"] }]

  - job_name: worker
    metrics_path: /metrics
    static_configs: [{ targets: ["worker:9101"] }]

  - job_name: embedder
    metrics_path: /metrics
    static_configs: [{ targets: ["embedder:8001"] }]

  # --- Хранилища ---
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]

  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"] }]

  - job_name: qdrant
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/qdrant_api_key
    static_configs: [{ targets: ["qdrant:6333"] }]

  - job_name: seaweedfs
    static_configs: [{ targets: ["seaweedfs:9324"] }]

  # --- Ресурсы контейнеров ---
  - job_name: cadvisor
    scrape_interval: 30s
    static_configs: [{ targets: ["cadvisor:8080"] }]
    metric_relabel_configs:
      # Оставляем только контейнеры с compose-метками (без системных cgroup).
      - source_labels: [container_label_com_docker_compose_service]
        regex: ""
        action: drop

  # --- Сам мониторинг ---
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]

  - job_name: alloy
    static_configs: [{ targets: ["alloy:12345"] }]

  - job_name: grafana
    static_configs: [{ targets: ["grafana:3000"] }]
