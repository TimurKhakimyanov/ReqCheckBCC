# Правила оповещений ReqCheck. Alertmanager не входит в стек: активные алерты видны
# в Prometheus (/alerts) и Grafana (Alerting → Alert rules → Data source-managed).
groups:
  - name: reqcheck
    rules:
      - alert: TargetDown
        expr: up{job=~"api|worker|embedder|postgres|redis|qdrant|seaweedfs|loki"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} недоступен для Prometheus 2 минуты"

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "postgres-exporter не может подключиться к Postgres"

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "redis-exporter не может подключиться к Redis"

      - alert: ApiHighErrorRate
        expr: |
          sum(rate(reqcheck_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(reqcheck_http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Больше 5% ответов API — ошибки 5xx"

      - alert: CeleryQueueBacklog
        expr: max(redis_key_size{key="celery"}) > 20
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "В очереди Celery больше 20 задач 10 минут — не хватает воркеров или LLM тормозит"

      - alert: RunsFailing
        expr: sum(increase(reqcheck_runs_total{status="failed"}[30m])) >= 3
        labels: { severity: warning }
        annotations:
          summary: "За 30 минут упало 3 и более прогона (причина — runs.error / логи worker)"

      - alert: LlmHighErrorRate
        # Ошибки по вызовам видит только api (чат); воркер отдаёт итоговые успешные вызовы прогона,
        # поэтому считаем долю по job="api", иначе ошибки чата растворяются в вызовах прогонов.
        expr: |
          sum by (provider) (rate(reqcheck_llm_requests_total{job="api", outcome="error"}[10m]))
            / clamp_min(sum by (provider) (rate(reqcheck_llm_requests_total{job="api"}[10m])), 1e-9) > 0.2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Больше 20% запросов к LLM из чата ({{ $labels.provider }}) заканчиваются ошибкой"

      - alert: EmbedderErrors
        expr: sum(increase(reqcheck_embedder_errors_total[10m])) > 5
        labels: { severity: warning }
        annotations:
          summary: "embedder вернул больше 5 ошибок за 10 минут — поиск и база знаний деградируют"

      - alert: LoginFailuresSpike
        expr: sum(increase(reqcheck_logins_total{result="failed"}[10m])) > 20
        labels: { severity: warning }
        annotations:
          summary: "Больше 20 неудачных входов за 10 минут — возможен перебор пароля"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / clamp_min(redis_memory_max_bytes, 1) > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Redis занял больше 90% maxmemory — при noeviction новые задачи начнут отклоняться"
