# Пример nginx НА ХОСТЕ перед стеком ReqCheck (TLS терминируется здесь).
# Стек слушает только 127.0.0.1:${WEB_PORT} (веб) и 127.0.0.1:${GRAFANA_PORT} (Grafana).
# Установка: скопировать в /etc/nginx/conf.d/reqcheck.conf, заменить reqcheck.example.kz,
# пути к сертификатам и порты (8080/3000 — значения по умолчанию из .env.example), затем
#   nginx -t && systemctl reload nginx
#
# Если Grafana открывается через /grafana/, задайте в .env:
#   GRAFANA_ROOT_URL=https://reqcheck.example.kz/grafana/
#   GRAFANA_SERVE_FROM_SUB_PATH=true
# (или вынесите Grafana на отдельный поддомен и уберите location /grafana/).

upstream reqcheck_web {
    server 127.0.0.1:8080;          # WEB_PORT
    keepalive 16;
}

upstream reqcheck_grafana {
    server 127.0.0.1:3000;          # GRAFANA_PORT
    keepalive 4;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name reqcheck.example.kz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name reqcheck.example.kz;

    # --- TLS: заглушки, подставьте свои сертификаты (корпоративный УЦ или Let's Encrypt) ---
    ssl_certificate     /etc/nginx/tls/reqcheck.crt;
    ssl_certificate_key /etc/nginx/tls/reqcheck.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:reqcheck_tls:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Загрузка документов: не меньше MAX_UPLOAD_MB из .env (по умолчанию 25 МБ) + запас.
    client_max_body_size 30m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # API: прогресс прогона и чат идут через SSE — без буферизации и с длинными таймаутами.
    location /api/ {
        proxy_pass http://reqcheck_web;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_request_buffering off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # SPA и статика
    location / {
        proxy_pass http://reqcheck_web;
        proxy_read_timeout 60s;
    }

    # Grafana (профиль monitoring). Ограничьте доступ своей сетью администраторов.
    location /grafana/ {
        # allow 10.0.0.0/8;
        # deny  all;
        proxy_pass http://reqcheck_grafana;
        proxy_set_header Upgrade    $http_upgrade;      # Grafana Live (WebSocket)
        proxy_set_header Connection $http_connection;
    }
}
