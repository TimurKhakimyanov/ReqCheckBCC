[project]
name = "reqcheck-embedder"
version = "0.1.0"
description = "ReqCheck embeddings service (local multilingual-e5 or provider API)"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30", "pydantic>=2.9,<3", "httpx>=0.27",
                "prometheus-client>=0.20"]

[project.optional-dependencies]
# torch ставится отдельно из CPU-индекса PyTorch (см. Dockerfile)
local = ["sentence-transformers>=3.0"]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["embedder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
