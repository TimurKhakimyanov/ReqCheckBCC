[project]
name = "reqcheck-api"
version = "0.1.0"
description = "ReqCheck HTTP API: auth, documents, runs, reports, chat, search, knowledge base"
requires-python = ">=3.12"
dependencies = [
    "req-contracts",
    "req-core",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30,<3",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "cryptography>=43",
    "boto3>=1.34",
    "qdrant-client>=1.12",
    "redis>=5.0",
    "httpx>=0.27",
    "celery[redis]>=5.4",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "asgi-lifespan>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
