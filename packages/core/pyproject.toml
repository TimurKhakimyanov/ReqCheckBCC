[project]
name = "req-core"
version = "0.1.0"
description = "ReqCheck agent core: parsing, requirement splitting, quality checks, report rendering, LLM providers"
requires-python = ">=3.12"
# Сессия «Ядро» добавит зависимости (SDK провайдеров, парсеры PDF/DOCX, рендер отчёта).
dependencies = ["req-contracts", "pydantic>=2.9,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["req_core"]
