[project]
name = "req-core"
version = "0.1.0"
description = "ReqCheck agent core: parsing, requirement splitting, quality checks, report rendering, LLM providers"
requires-python = ">=3.12"
# Мажорные версии SDK зафиксированы: тонкий слой провайдеров написан под их API.
dependencies = [
    "req-contracts",
    "pydantic>=2.9,<3",
    "google-genai>=1.30,<2",
    "openai>=1.60,<2",
    "anthropic>=0.60,<1",
    "pymupdf>=1.24,<2",
    "python-docx>=1.1,<2",
    "fpdf2>=2.8,<3",
    "rapidfuzz>=3.9,<4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
reqcheck = "req_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["req_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
